name: Deploy Firebase Hosting

on:
  push:
    branches:
      - master
      - main
      - "deploy-*"
    paths:
      - "usbshop-web/app/usbshop/**"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usbshop-web/app/usbshop
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: usbshop-web/app/usbshop/package-lock.json

      - name: Install deps
        run: npm install

      - name: Build static export
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ORDER_SECRET: ${{ vars.NEXT_PUBLIC_ORDER_SECRET || secrets.NEXT_PUBLIC_ORDER_SECRET }}
          NEXT_PUBLIC_SYNC_SECRET: ${{ vars.NEXT_PUBLIC_SYNC_SECRET || secrets.NEXT_PUBLIC_SYNC_SECRET }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud (service account)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (service account)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: firebase deploy --only hosting --project usb-shop-2dc00

      - name: Deploy to Firebase Hosting (token)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: firebase deploy --only hosting --project usb-shop-2dc00 --token "${{ env.FIREBASE_TOKEN }}"
