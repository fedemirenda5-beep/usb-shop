databases:
  - name: usbshop-db
    databaseName: usbshop
    user: usbshop

services:
  - type: web
    name: usbshop-api
    env: python
    region: oregon
    plan: free
    rootDir: usbshop-web/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONTROLSTOCK_DATABASE_URL
        fromDatabase:
          name: usbshop-db
          property: connectionString
      - key: USB_ALLOWED_ORIGINS
        value: https://www.usbshop.com.ar,https://usbshop.com.ar
      - key: USB_ALLOWED_ORIGIN_REGEX
        value: ^https://([a-z0-9-]+\.)*usbshop\.com\.ar$
      - key: USB_AUTH_SECRET
        value: usbshop2026securekey1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7
      - key: USB_ORDER_SECRET
        value: ""
      - key: USB_SYNC_SECRET
        value: ""

  - type: web
    name: usbshop-web
    env: static
    plan: free
    rootDir: usbshop-web/app/usbshop
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.usbshop.com.ar
